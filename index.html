<script>
// Short celebratory sound for correct answers (works without an external audio file)
function playCorrectSound(){
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const ctx = new AudioContextClass();
    const now = ctx.currentTime;
    // Two bright notes to give a clear, pleasant correct-answer chime.
    [880, 1175].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.12);
      gain.gain.setValueAtTime(0.0001, now + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.16, now + i * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.24);
    });
    setTimeout(() => ctx.close(), 700);
  } catch (e) { console.log('Correct-answer sound unavailable:', e); }
}

ദ്ധത്തിലാണ്."},{"q_en":"Which of the following is a Centrist Party in India?","q_ml":"ഇന്ത്യയിലെ മധ്യപക്ഷ രാഷ്ട്രീയ പാർട്ടി ഏതാണ്?","o":["Indian National Congress","Bharatiya Janata Party","Communist Party of India (Marxist)","Communist Party of India"],"a":0,"e":"ഈ ചോദ്യത്തിലെ ഉത്തരസൂചിക പ്രകാരം ഇന്ത്യൻ നാഷണൽ കോൺഗ്രസിനെയാണ് മധ്യപക്ഷ പാർട്ടിയായി കണക്കാക്കിയിരിക്കുന്നത്."},{"q_en":"Who has the power to form a new State within the Union of India?","q_ml":"ഇന്ത്യൻ യൂണിയനിൽ പുതിയ സംസ്ഥാനം രൂപീകരിക്കാൻ അധികാരമുള്ളത് ആർക്കാണ്?","o":["The President of India","The Cabinet","The Supreme Court","Parliament"],"a":3,"e":"ഇന്ത്യൻ ഭരണഘടനയുടെ അനുച്ഛേദം 3 പ്രകാരം പുതിയ സംസ്ഥാനങ്ങൾ രൂപീകരിക്കാനും സംസ്ഥാനങ്ങളുടെ അതിർത്തികളിൽ മാറ്റം വരുത്താനും പാർലമെന്റിന് അധികാരമുണ്ട്."},{"q_en":"Which Article of the Constitution of India specifically mentions Village Panchayats?","q_ml":"ഗ്രാമപഞ്ചായത്തുകളെക്കുറിച്ച് പ്രത്യേകമായി പരാമർശിക്കുന്ന ഇന്ത്യൻ ഭരണഘടനയുടെ അനുച്ഛേദം ഏതാണ്?","o":["Article 40","Article 45","Article 49","Article 51"],"a":0,"e":"ഭരണഘടനയുടെ അനുച്ഛേദം 40 ഗ്രാമപഞ്ചായത്തുകൾ രൂപീകരിക്കുന്നതിനും അവയ്ക്ക് അധികാരം നൽകുന്നതിനും സംസ്ഥാനത്തോട് നിർദേശിക്കുന്നു."},{"q_en":"Which of the following is NOT related to the effects of tides?","q_ml":"വേലിയേറ്റത്തിന്റെ ഫലങ്ങളുമായി ബന്ധപ്പെട്ടിട്ടില്ലാത്തത് ഏതാണ്?","o":["Tidal energy can be used for power generation.","Influence the climate of coastal region.","Debris dumped along seashores and ports is washed off to the deep sea.","Ships can be brought to shallow harbours during high tides."],"a":1,"e":"നൽകിയിരിക്കുന്ന ഉത്തരസൂചിക പ്രകാരം തീരദേശ കാലാവസ്ഥയെ സ്വാധീനിക്കുന്നത് വേലിയേറ്റത്തിന്റെ പ്രധാന ഫലമായി കണക്കാക്കുന്നില്ല. വേലിയേറ്റ ഊർജം വൈദ്യുതി ഉൽപാദനത്തിനും ഉയർന്ന വേലിയേറ്റ സമയത്ത് കപ്പലുകൾ ആഴം കുറഞ്ഞ തുറമുഖങ്ങളിൽ പ്രവേശിക്കുന്നതിനും സഹായിക്കുന്നു."},{"q_en":"Which one of the following is NOT a method of estimating National Income?","q_ml":"ദേശീയ വരുമാനം കണക്കാക്കുന്നതിനുള്ള രീതികളിൽ ഉൾപ്പെടാത്തത് ഏതാണ്?","o":["Income method","Value added method","Export-Import method","Expenditure method"],"a":2,"e":"ദേശീയ വരുമാനം കണക്കാക്കുന്നതിനുള്ള പ്രധാന രീതികൾ വരുമാന രീതി, മൂല്യവർധിത രീതി, ചെലവ് രീതി എന്നിവയാണ്."},{"q_en":"What are the characteristics of the Indus Valley Civilization?","q_ml":"സിന്ധുനദീതട സംസ്കാരത്തിന്റെ സവിശേഷതകൾ ഏതെല്ലാമാണ്?","o":["i, ii, iii, iv","ii, iii, iv, v","ii, iv, v","i, iii, iv, v"],"a":0,"e":"ആസൂത്രിത നഗരനിർമാണം, മലിനജല നിർഗമന സംവിധാനം, ചുട്ട ഇഷ്ടികകളുടെ ഉപയോഗം, വ്യത്യസ്ത കെട്ടിടരൂപങ്ങൾ, തുറമുഖ നഗരങ്ങൾ എന്നിവ സിന്ധുനദീതട സംസ്കാരത്തിന്റെ സവിശേഷതകളായിരുന്നു. കല കളിമണ്ണിൽ മാത്രം അധിഷ്ഠിതമായിരുന്നില്ല."},{"q_en":"Name the imaginary lines joining places with the same elevation above sea level.","q_ml":"സമുദ്രനിരപ്പിൽനിന്ന് ഒരേ ഉയരത്തിലുള്ള സ്ഥലങ്ങളെ ബന്ധിപ്പിക്കുന്ന സാങ്കൽപ്പിക രേഖകൾ ഏവയാണ്?","o":["Lines of Latitudes","Contour lines","International Date Line","Lines of Longitudes"],"a":1,"e":"സമുദ്രനിരപ്പിൽനിന്ന് ഒരേ ഉയരമുള്ള സ്ഥലങ്ങളെ ബന്ധിപ്പിക്കുന്ന രേഖകളാണ് കോണ്ടൂർ രേഖകൾ."},{"q_en":"Which of the following statements are correct?","q_ml":"താഴെപ്പറയുന്ന പ്രസ്താവനകളിൽ ശരിയായവ ഏതെല്ലാമാണ്?","o":["i, iii, iv","i, ii, iv","i, ii, iii","ii, iii, iv"],"a":0,"e":"നൽകിയിരിക്കുന്ന ഉത്തരസൂചിക പ്രകാരം ഒന്നാമത്തെയും മൂന്നാമത്തെയും നാലാമത്തെയും പ്രസ്താവനകൾ ശരിയാണ്. യന്ത്രവൽക്കരണത്തിനെതിരായ തൊഴിലാളികളുടെ പ്രതിഷേധവുമായി ലുഡൈറ്റ് പ്രസ്ഥാനം ബന്ധപ്പെട്ടിരുന്നു."},{"q_en":"The Attingal Revolt was held in:","q_ml":"ആറ്റിങ്ങൽ കലാപം നടന്ന വർഷം ഏതാണ്?","o":["1741","1761","1781","1721"],"a":3,"e":"ബ്രിട്ടീഷ് ഈസ്റ്റ് ഇന്ത്യാ കമ്പനിക്കെതിരെ കേരളത്തിൽ നടന്ന ആദ്യകാല സംഘടിത പ്രക്ഷോഭങ്ങളിലൊന്നായ ആറ്റിങ്ങൽ കലാപം 1721-ലാണ് നടന്നത്."},{"q_en":"Which of the following cities is the headquarters of ASEAN?","q_ml":"ആസിയാന്റെ ആസ്ഥാനം ഏത് നഗരത്തിലാണ്?","o":["Singapore","Manila","Jakarta","Bangkok"],"a":2,"e":"തെക്കുകിഴക്കൻ ഏഷ്യൻ രാഷ്ട്രങ്ങളുടെ കൂട്ടായ്മയായ ആസിയാന്റെ സെക്രട്ടേറിയറ്റ് ഇന്തോനേഷ്യയിലെ ജക്കാർത്തയിലാണ്."},{"q_en":"India signed the Panchasheel Agreement with:","q_ml":"ഇന്ത്യ പഞ്ചശീല കരാറിൽ ഒപ്പുവെച്ചത് ഏത് രാജ്യവുമായാണ്?","o":["Pakistan","Sri Lanka","China","Nepal"],"a":2,"e":"ഇന്ത്യയും ചൈനയും 1954-ൽ പഞ്ചശീല തത്ത്വങ്ങളുമായി ബന്ധപ്പെട്ട കരാറിൽ ഒപ്പുവെച്ചു."},{"q_en":"Which one of the following is NOT an instrument of monetary policy?","q_ml":"പണനയത്തിന്റെ ഉപകരണമല്ലാത്തത് ഏതാണ്?","o":["Bank rate","Cash Reserve Ratio","Statutory Liquidity Ratio","Taxation"],"a":3,"e":"ബാങ്ക് നിരക്ക്, CRR, SLR എന്നിവ പണനയവുമായി ബന്ധപ്പെട്ട ഉപകരണങ്ങളാണ്. നികുതി ധനനയത്തിന്റെ ഭാഗമാണ്."},{"q_en":"Which of the following is NOT a Directive Principle of State Policy?","q_ml":"രാഷ്ട്രനയ നിർദ്ദേശക തത്ത്വങ്ങളിൽ ഉൾപ്പെടാത്തത് ഏതാണ്?","o":["To provide adequate means of livelihood for all.","To develop a scientific temper.","To separate the Judiciary from the Executive.","To promote International Peace and Security."],"a":1,"e":"ശാസ്ത്രീയ മനോഭാവം വളർത്തുക എന്നത് ഭരണഘടനയുടെ അനുച്ഛേദം 51A പ്രകാരമുള്ള മൗലിക കടമയാണ്."},{"q_en":"The local wind ‘Mango Showers’ is experienced in India during:","q_ml":"ഇന്ത്യയിൽ ‘മാംഗോ ഷവേഴ്സ്’ എന്ന പ്രാദേശിക മഴ അനുഭവപ്പെടുന്ന കാലം ഏതാണ്?","o":["Winter season","South-West Monsoon season","Summer season","North-East Monsoon season"],"a":2,"e":"വേനൽക്കാലത്തിന്റെ അവസാനത്തിൽ, പ്രത്യേകിച്ച് ഏപ്രിൽ–മേയ് മാസങ്ങളിൽ കേരളത്തിലും കർണാടകത്തിലും ലഭിക്കുന്ന മഴയാണ് മാംഗോ ഷവേഴ്സ്."},{"q_en":"Who is the present President of the World Bank?","q_ml":"ലോകബാങ്കിന്റെ പ്രസിഡന്റ് ആരാണ്?","o":["Robert Zoellick","Jim Yong Kim","Ajay Banga","Christine Lagarde"],"a":2,"e":"നൽകിയിരിക്കുന്ന ചോദ്യത്തിന്റെ ഉത്തരസൂചികയിൽ അജയ് ബംഗയാണ് ഉത്തരം."},{"q_en":"The Allahabad Pillar inscription is associated with:","q_ml":"അലഹബാദ് സ്തംഭലിഖിതം ഏത് ഭരണാധികാരിയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു?","o":["Chandra Gupta I","Chandra Gupta Maurya","Samudra Gupta","Chandra Gupta II"],"a":2,"e":"സമുദ്രഗുപ്തന്റെ സൈനിക വിജയങ്ങളും ഭരണവും വിവരിക്കുന്ന പ്രശസ്തമായ പ്രയാഗ പ്രശസ്തി അലഹബാദ് സ്തംഭവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു. ഹരിഷേനനാണ് ഇതിന്റെ രചയിതാവ്."},{"q_en":"The process that helps in the formation of landforms is called:","q_ml":"ഭൂപ്രകൃതികൾ രൂപപ്പെടാൻ സഹായിക്കുന്ന പ്രക്രിയ അറിയപ്പെടുന്നത് എന്ത്?","o":["Transpiration process","Condensation process","Geomorphic process","Sublimation process"],"a":2,"e":"ഭൂമിയുടെ ഉപരിതലത്തിൽ ഭൂരൂപങ്ങൾ രൂപപ്പെടുന്നതിനും മാറ്റം സംഭവിക്കുന്നതിനും കാരണമാകുന്ന പ്രക്രിയകളാണ് ഭൗമരൂപീകരണ പ്രക്രിയകൾ."},{"q_en":"Which nation was NOT part of the Axis Powers during World War II?","q_ml":"രണ്ടാം ലോകമഹായുദ്ധത്തിൽ അച്ചുതണ്ട് ശക്തികളിൽ ഉൾപ്പെടാത്ത രാജ്യം ഏതാണ്?","o":["Britain","Germany","Italy","Japan"],"a":0,"e":"ബ്രിട്ടൻ സഖ്യകക്ഷികളുടെ ഭാഗമായിരുന്നു. ജർമ്മനി, ഇറ്റലി, ജപ്പാൻ എന്നിവ പ്രധാന അച്ചുതണ്ട് ശക്തികളായിരുന്നു."},{"q_en":"Identify the inland waterway in India declared as National Waterway 3 (NW3).","q_ml":"ദേശീയ ജലപാത 3 (NW3) ആയി പ്രഖ്യാപിച്ച ഇന്ത്യയിലെ ജലപാത ഏതാണ്?","o":["The west coastal canal in Kerala from Kollam to Kottappuram.","Sadiya to Dhubri in the river Brahmaputra.","Canal from Kakinada to Puducherry linking Godavari and Krishna.","Allahabad to Haldia in the river Ganga."],"a":0,"e":"കേരളത്തിലെ കൊല്ലം മുതൽ കോട്ടപ്പുറം വരെയുള്ള പശ്ചിമതീര കനാൽ ദേശീയ ജലപാത 3-ന്റെ പ്രധാന ഭാഗമാണ്."},{"q_en":"The broad, flat valleys seen along the Siwalik ranges are called:","q_ml":"സിവാലിക് മലനിരകൾക്കരികിലുള്ള വിശാലവും പരന്നതുമായ താഴ്‌വരകൾ അറിയപ്പെടുന്നത് എന്ത്?","o":["Rift valleys","Duns","Passes","U-shaped valleys"],"a":1,"e":"സിവാലിക് മലനിരകൾക്കും ഹിമാലയത്തിലെ ഉയർന്ന മലനിരകൾക്കും ഇടയിൽ കാണപ്പെടുന്ന നീളമേറിയ താഴ്‌വരകളാണ് ഡൂണുകൾ. ഡെറാഡൂൺ ഒരു ഉദാഹരണമാണ്."},{"q_en":"Which among the following is known as the ‘Universal Fibre’?","q_ml":"‘സാർവത്രിക നാര്’ എന്നറിയപ്പെടുന്നത് ഏതാണ്?","o":["Cotton","Jute","Silk","Wool"],"a":0,"e":"വസ്ത്രനിർമാണത്തിൽ വ്യാപകമായി ഉപയോഗിക്കുന്ന പ്രകൃതിദത്ത നാരാണ് പരുത്തി. ഈ ചോദ്യത്തിലെ ഉത്തരസൂചികയിൽ പരുത്തിയെയാണ് സാർവത്രിക നാര് എന്ന് നൽകിയിരിക്കുന്നത്."},{"q_en":"Which of the following statements are correct?","q_ml":"വ്യാപാരസംഘങ്ങളെക്കുറിച്ചുള്ള താഴെപ്പറയുന്നവ ശരിയായി യോജിപ്പിക്കുക.","o":["a-3, b-4, c-2, d-1","a-4, b-1, c-2, d-3","a-3, b-1, c-4, d-2","a-4, b-3, c-1, d-2"],"a":3,"e":"നൽകിയിരിക്കുന്ന ഉത്തരസൂചിക പ്രകാരം മണിഗ്രാമം സിറിയൻ ക്രിസ്ത്യാനികളുമായും അഞ്ചുവണ്ണം ജൂത വ്യാപാരികളുമായും ബന്ധപ്പെട്ടിരിക്കുന്നു. വളഞ്ചിയർ വിദേശ വ്യാപാരവുമായി ബന്ധപ്പെട്ടവരായിരുന്നു."},{"q_en":"Choose the correct statements.","q_ml":"താഴെപ്പറയുന്ന പ്രസ്താവനകളിൽ ശരിയായവ തിരഞ്ഞെടുക്കുക.","o":["(ii), (iii), (iv)","(i), (ii), (iii), (iv)","(i), (ii), (iii)","(i), (ii), (iv)"],"a":0,"e":"“പ്രവർത്തിക്കുക അല്ലെങ്കിൽ മരിക്കുക” എന്ന ഗാന്ധിജിയുടെ ആഹ്വാനം 1942-ലെ ക്വിറ്റ് ഇന്ത്യാ സമരവുമായി ബന്ധപ്പെട്ടതാണ്; നിയമലംഘന സമരവുമായി അല്ല. അതിനാൽ ഒന്നാമത്തെ പ്രസ്താവന തെറ്റാണ്. ## Part 2: Social Science Pedagogy (Questions 121–150)"},{"q_en":"Which of the following is the most appropriate method to teach a sensitive historical topic like communal riots?","q_ml":"വർഗീയ കലാപങ്ങൾ പോലുള്ള സെൻസിറ്റീവായ ചരിത്രവിഷയം പഠിപ്പിക്കാൻ ഏറ്റവും അനുയോജ്യമായ രീതി ഏതാണ്?","o":["Reading from textbook only","Presenting multiple perspectives with empathy","Avoiding the topic altogether","Lecture with one-sided narrative"],"a":1,"e":"വ്യത്യസ്ത വീക്ഷണങ്ങൾ സഹാനുഭൂതിയോടെ അവതരിപ്പിക്കുന്നത് കുട്ടികളിൽ ചരിത്രബോധവും വിമർശനാത്മക ചിന്തയും വളർത്തുന്നു."},{"q_en":"To teach map skills effectively, a teacher should:","q_ml":"ഭൂപട നൈപുണ്യങ്ങൾ ഫലപ്രദമായി പഠിപ്പിക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Skip map work","Show maps on screen only","Use blank maps for labeling and interpretation","Ask students to memorize maps"],"a":2,"e":"ശൂന്യഭൂപടങ്ങളിൽ സ്ഥലങ്ങൾ അടയാളപ്പെടുത്തുകയും വിവരങ്ങൾ വ്യാഖ്യാനിക്കുകയും ചെയ്യുന്നത് ഭൂപട നൈപുണ്യങ്ങൾ വളർത്തുന്നു."},{"q_en":"Which activity best promotes critical thinking in Civics?","q_ml":"പൗരശാസ്ത്രത്തിൽ വിമർശനാത്മക ചിന്ത വളർത്താൻ ഏറ്റവും അനുയോജ്യമായ പ്രവർത്തനം ഏതാണ്?","o":["Memorizing articles","Conducting mock parliament","Reading aloud","Copying definitions"],"a":1,"e":"മാതൃകാ പാർലമെന്റ് കുട്ടികൾക്ക് ചർച്ച ചെയ്യാനും അഭിപ്രായങ്ങൾ അവതരിപ്പിക്കാനും ജനാധിപത്യ നടപടികൾ മനസ്സിലാക്കാനും അവസരം നൽകുന്നു."},{"q_en":"A student with visual impairment struggles with geography maps. What is the best accommodation?","q_ml":"കാഴ്ചപരിമിതിയുള്ള ഒരു വിദ്യാർഥിക്ക് ഭൂമിശാസ്ത്ര ഭൂപടങ്ങൾ മനസ്സിലാക്കാൻ ബുദ്ധിമുട്ടുണ്ടെങ്കിൽ ഏറ്റവും അനുയോജ്യമായ പഠനസഹായം ഏതാണ്?","o":["Reduce marks","Provide tactile maps and audio descriptions","Exclude from map work","Give extra homework"],"a":1,"e":"സ്പർശിച്ച് മനസ്സിലാക്കാവുന്ന ഭൂപടങ്ങളും ശബ്ദവിവരണങ്ങളും നൽകുന്നത് കാഴ്ചപരിമിതിയുള്ള കുട്ടികൾക്ക് പഠനം സുഗമമാക്കുന്നു."},{"q_en":"Which teaching strategy is most suitable for teaching democracy as a concept?","q_ml":"ജനാധിപത്യം എന്ന ആശയം പഠിപ്പിക്കാൻ ഏറ്റവും അനുയോജ്യമായ ബോധനതന്ത്രം ഏതാണ്?","o":["Memorization","Role-play and group discussion","Dictating notes","Reading textbook"],"a":1,"e":"റോൾ പ്ലേയും ഗ്രൂപ്പ് ചർച്ചയും വഴി കുട്ടികൾക്ക് ജനാധിപത്യത്തിലെ പങ്കാളിത്തം, അഭിപ്രായസ്വാതന്ത്ര്യം, സഹകരണം എന്നിവ അനുഭവിച്ചറിയാം."},{"q_en":"To make Economics relatable, a teacher should:","q_ml":"സാമ്പത്തികശാസ്ത്രം കുട്ടികളുടെ ദൈനംദിന ജീവിതവുമായി ബന്ധപ്പെടുത്തി പഠിപ്പിക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Use real-life examples like market visits","Avoid examples","Focus on definitions only","Teach only theory"],"a":0,"e":"മാർക്കറ്റ് സന്ദർശനം പോലുള്ള യഥാർഥ ജീവിതാനുഭവങ്ങൾ സാമ്പത്തിക ആശയങ്ങൾ എളുപ്പത്തിൽ മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"Which of the following is an example of a primary source in History?","q_ml":"ചരിത്രത്തിലെ പ്രാഥമിക സ്രോതസ്സിന് ഉദാഹരണം ഏതാണ്?","o":["Wikipedia","Teacher’s notes","Newspaper article from the time period","Textbook"],"a":2,"e":"ഒരു സംഭവം നടന്ന കാലഘട്ടത്തിൽ പ്രസിദ്ധീകരിച്ച പത്രവാർത്ത ആ കാലത്തെ സംഭവങ്ങളെക്കുറിച്ചുള്ള പ്രാഥമിക സ്രോതസ്സായി ഉപയോഗിക്കാം."},{"q_en":"How can a teacher address gender bias in Social Science textbooks?","q_ml":"സാമൂഹ്യശാസ്ത്ര പാഠപുസ്തകങ്ങളിലെ ലിംഗവിവേചനം അധ്യാപകന് എങ്ങനെ കൈകാര്യം ചെയ്യാം?","o":["Skip those chapters","Highlight and discuss with students","Ignore it","Teach as written"],"a":1,"e":"പാഠപുസ്തകങ്ങളിലെ ലിംഗവിവേചനം തിരിച്ചറിയുകയും ചർച്ച ചെയ്യുകയും ചെയ്യുന്നതിലൂടെ കുട്ടികളിൽ ലിംഗസമത്വബോധം വളർത്താം."},{"q_en":"Which of the following is NOT a suitable assessment method for Social Science?","q_ml":"സാമൂഹ്യശാസ്ത്രത്തിന് അനുയോജ്യമല്ലാത്ത മൂല്യനിർണയ രീതി ഏതാണ്?","o":["Rote memory testing only","Debate on social issues","Map-based questions","Project work"],"a":0,"e":"കാണാപ്പാഠം മാത്രം പരിശോധിക്കുന്നത് കുട്ടികളുടെ വിമർശനാത്മക ചിന്ത, പ്രായോഗിക അറിവ്, പ്രശ്നപരിഹാരശേഷി എന്നിവ വിലയിരുത്താൻ പര്യാപ്തമല്ല."},{"q_en":"To teach the Indian Constitution effectively, a teacher should:","q_ml":"ഇന്ത്യൻ ഭരണഘടന ഫലപ്രദമായി പഠിപ്പിക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Skip preambles","Dictate articles","Focus on memorization","Use case studies and real-life examples"],"a":3,"e":"യഥാർഥ ജീവിതത്തിലെ സംഭവങ്ങളും കേസ് പഠനങ്ങളും ഉപയോഗിക്കുന്നത് ഭരണഘടനാ തത്ത്വങ്ങൾ പ്രായോഗികമായി മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"Which of the following is a good way to teach cultural diversity?","q_ml":"സാംസ്കാരിക വൈവിധ്യം പഠിപ്പിക്കുന്നതിനുള്ള നല്ല മാർഗം ഏതാണ്?","o":["Teach one culture only","Celebrate different cultures in class","Avoid discussion","Lecture only"],"a":1,"e":"വിവിധ സംസ്കാരങ്ങളെ പരിചയപ്പെടുത്തുകയും അവയുമായി ബന്ധപ്പെട്ട പ്രവർത്തനങ്ങൾ സംഘടിപ്പിക്കുകയും ചെയ്യുന്നത് പരസ്പര ബഹുമാനം വളർത്തുന്നു."},{"q_en":"A student asks, “Why study history if it has already happened?” How should the teacher respond?","q_ml":"“സംഭവിച്ചുകഴിഞ്ഞ കാര്യങ്ങൾ എന്തിനാണ് ചരിത്രമായി പഠിക്കുന്നത്?” എന്ന് ഒരു വിദ്യാർഥി ചോദിച്ചാൽ അധ്യാപകൻ എങ്ങനെ പ്രതികരിക്കണം?","o":["Say it’s compulsory","Explain relevance to present and future","Punish for questioning","Ignore the question"],"a":1,"e":"ഭൂതകാല സംഭവങ്ങൾ വർത്തമാനകാലത്തെ മനസ്സിലാക്കാനും ഭാവിയിലെ തീരുമാനങ്ങൾ എടുക്കാനും സഹായിക്കുന്നുവെന്ന് അധ്യാപകൻ വിശദീകരിക്കണം."},{"q_en":"Which of the following is a suitable activity for teaching local self-government?","q_ml":"പ്രാദേശിക സ്വയംഭരണം പഠിപ്പിക്കാൻ അനുയോജ്യമായ പ്രവർത്തനം ഏതാണ്?","o":["Memorizing names","Reading textbook","Visiting local panchayat office","Skipping topic"],"a":2,"e":"പഞ്ചായത്ത് ഓഫീസ് സന്ദർശിക്കുന്നതിലൂടെ പ്രാദേശിക ഭരണസ്ഥാപനങ്ങളുടെ പ്രവർത്തനം നേരിട്ട് മനസ്സിലാക്കാം."},{"q_en":"How can geography field trips be made inclusive?","q_ml":"ഭൂമിശാസ്ത്ര ഫീൽഡ് ട്രിപ്പുകൾ എല്ലാ കുട്ടികൾക്കും പങ്കെടുക്കാൻ കഴിയുന്ന രീതിയിൽ എങ്ങനെ സംഘടിപ്പിക്കാം?","o":["Plan accessible locations and activities","Avoid field trips","Make it optional","Exclude students with disabilities"],"a":0,"e":"ഭിന്നശേഷിയുള്ള കുട്ടികൾ ഉൾപ്പെടെ എല്ലാവർക്കും പങ്കെടുക്കാൻ കഴിയുന്ന സ്ഥലങ്ങളും പ്രവർത്തനങ്ങളും തിരഞ്ഞെടുക്കണം."},{"q_en":"Which is a good way to assess students’ understanding of social justice?","q_ml":"സാമൂഹികനീതിയെക്കുറിച്ചുള്ള കുട്ടികളുടെ ധാരണ വിലയിരുത്താൻ അനുയോജ്യമായ മാർഗം ഏതാണ്?","o":["No assessment","Memorization of terms","Essay on real-life examples","Objective test only"],"a":2,"e":"യഥാർഥ ജീവിതത്തിലെ ഉദാഹരണങ്ങളെ അടിസ്ഥാനമാക്കി ഉപന്യാസം തയ്യാറാക്കുന്നത് സാമൂഹികനീതിയെക്കുറിച്ചുള്ള കുട്ടികളുടെ ധാരണയും വിശകലനശേഷിയും വിലയിരുത്താൻ സഹായിക്കുന്നു."},{"q_en":"To teach globalization effectively, a teacher should:","q_ml":"ആഗോളവൽക്കരണം ഫലപ്രദമായി പഠിപ്പിക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Use news articles and case studies","Teach only theory","Focus on definitions","Avoid examples"],"a":0,"e":"വാർത്തകളും കേസ് പഠനങ്ങളും ഉപയോഗിക്കുന്നത് ആഗോളവൽക്കരണത്തിന്റെ സാമ്പത്തികവും സാമൂഹികവുമായ പ്രത്യാഘാതങ്ങൾ മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"Which is a suitable method for teaching environmental studies in Social Science?","q_ml":"സാമൂഹ്യശാസ്ത്രത്തിൽ പരിസ്ഥിതി പഠനം പഠിപ്പിക്കാൻ അനുയോജ്യമായ രീതി ഏതാണ്?","o":["Skipping topic","Memorization of facts","Lecture only","Project-based learning on local issues"],"a":3,"e":"മാലിന്യസംസ്കരണം, ജലസംരക്ഷണം തുടങ്ങിയ പ്രാദേശിക പ്രശ്നങ്ങളെ അടിസ്ഥാനമാക്കിയുള്ള പ്രോജക്റ്റുകൾ പരിസ്ഥിതി ബോധം വളർത്തുന്നു."},{"q_en":"A student struggles with understanding timelines. What is the best strategy?","q_ml":"ചരിത്രസംഭവങ്ങളുടെ കാലക്രമം മനസ്സിലാക്കാൻ ഒരു വിദ്യാർഥിക്ക് ബുദ്ധിമുട്ടുണ്ടെങ്കിൽ ഏറ്റവും അനുയോജ്യമായ പഠനതന്ത്രം ഏതാണ്?","o":["Punish for mistakes","Use visual aids and interactive timelines","Ignore timelines","Skip history"],"a":1,"e":"ചിത്രസഹായങ്ങളും സംവേദനാത്മക ടൈംലൈനുകളും ഉപയോഗിക്കുന്നത് ചരിത്രസംഭവങ്ങളുടെ ക്രമവും കാലബന്ധവും മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"Which is a good way to teach human rights?","q_ml":"മനുഷ്യാവകാശങ്ങൾ പഠിപ്പിക്കുന്നതിനുള്ള നല്ല മാർഗം ഏതാണ്?","o":["Memorization","Avoid discussion","Role-play and case studies","Dictate articles"],"a":2,"e":"റോൾ പ്ലേയും കേസ് പഠനങ്ങളും ഉപയോഗിക്കുന്നത് മനുഷ്യാവകാശങ്ങളുടെ പ്രാധാന്യവും ലംഘനങ്ങളുടെ പ്രത്യാഘാതങ്ങളും മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"To teach economic development effectively, a teacher should:","q_ml":"സാമ്പത്തിക വികസനം ഫലപ്രദമായി പഠിപ്പിക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Avoid examples","Teach only theory","Use case studies of different countries","Focus on statistics only"],"a":2,"e":"വിവിധ രാജ്യങ്ങളുടെ വികസന മാതൃകകൾ താരതമ്യം ചെയ്യുന്നതിലൂടെ സാമ്പത്തിക വികസനത്തിന്റെ വ്യത്യസ്ത വശങ്ങൾ മനസ്സിലാക്കാം."},{"q_en":"Which is a suitable activity for teaching cultural heritage?","q_ml":"സാംസ്കാരിക പൈതൃകം പഠിപ്പിക്കാൻ അനുയോജ്യമായ പ്രവർത്തനം ഏതാണ്?","o":["Memorizing names","Visiting heritage sites or virtual tours","Reading textbook","Skipping topic"],"a":1,"e":"പൈതൃകകേന്ദ്രങ്ങൾ നേരിട്ട് സന്ദർശിക്കുന്നതോ വെർച്വൽ ടൂറുകൾ ഉപയോഗിക്കുന്നതോ ചരിത്രസ്മാരകങ്ങളെയും സാംസ്കാരിക പൈതൃകത്തെയും അടുത്തറിയാൻ സഹായിക്കുന്നു."},{"q_en":"How can a teacher address students’ misconceptions in Social Science?","q_ml":"സാമൂഹ്യശാസ്ത്രത്തിൽ കുട്ടികൾക്കുള്ള തെറ്റായ ധാരണകൾ അധ്യാപകൻ എങ്ങനെ തിരുത്തണം?","o":["Punish for wrong answers","Avoid discussion","Ignore them","Discuss and clarify with evidence"],"a":3,"e":"കുട്ടികളുടെ തെറ്റായ ധാരണകൾ തെളിവുകളും യുക്തിപരമായ ചർച്ചകളും ഉപയോഗിച്ച് തിരുത്തുന്നതാണ് ഉചിതമായ ബോധനരീതി."},{"q_en":"Which is a good way to teach political parties?","q_ml":"രാഷ്ട്രീയ പാർട്ടികളെ പഠിപ്പിക്കുന്നതിനുള്ള നല്ല മാർഗം ഏതാണ്?","o":["Avoid discussion","Memorization","Conduct mock elections","Dictate notes"],"a":2,"e":"മാതൃകാ തിരഞ്ഞെടുപ്പുകൾ സംഘടിപ്പിക്കുന്നത് രാഷ്ട്രീയ പാർട്ടികളുടെ പങ്ക്, തിരഞ്ഞെടുപ്പ് പ്രക്രിയ, ജനാധിപത്യത്തിലെ വോട്ടിന്റെ പ്രാധാന്യം എന്നിവ മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"To teach urbanization effectively, a teacher should:","q_ml":"നഗരവൽക്കരണം ഫലപ്രദമായി പഠിപ്പിക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Avoid examples","Teach only theory","Use case studies of cities","Focus on definitions"],"a":2,"e":"വിവിധ നഗരങ്ങളെക്കുറിച്ചുള്ള പഠനങ്ങൾ ഉപയോഗിക്കുന്നത് നഗരവൽക്കരണത്തിന്റെ കാരണങ്ങൾ, ഗുണങ്ങൾ, പ്രശ്നങ്ങൾ എന്നിവ മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"Which is a suitable method for teaching social movements?","q_ml":"സാമൂഹിക പ്രസ്ഥാനങ്ങൾ പഠിപ്പിക്കാൻ അനുയോജ്യമായ രീതി ഏതാണ്?","o":["Skipping topic","Memorization of names","Case studies and role-play","Lecture only"],"a":2,"e":"സാമൂഹിക പ്രസ്ഥാനങ്ങളുടെ ലക്ഷ്യങ്ങൾ, പ്രവർത്തനരീതികൾ, പ്രത്യാഘാതങ്ങൾ എന്നിവ കേസ് പഠനങ്ങളിലൂടെയും റോൾ പ്ലേയിലൂടെയും മനസ്സിലാക്കാം."},{"q_en":"A student asks, “Why learn about other countries?” How should the teacher respond?","q_ml":"“മറ്റു രാജ്യങ്ങളെക്കുറിച്ച് എന്തിനാണ് പഠിക്കുന്നത്?” എന്ന് ഒരു വിദ്യാർഥി ചോദിച്ചാൽ അധ്യാപകൻ എന്തു വിശദീകരിക്കണം?","o":["Punish for questioning","Explain global interconnectedness","Ignore the question","Say it’s compulsory"],"a":1,"e":"രാജ്യങ്ങൾ തമ്മിലുള്ള വ്യാപാരം, സംസ്കാരം, പരിസ്ഥിതി, രാഷ്ട്രീയം തുടങ്ങിയ ബന്ധങ്ങൾ നമ്മുടെ ജീവിതത്തെ സ്വാധീനിക്കുന്നുവെന്ന് വിശദീകരിക്കണം."},{"q_en":"Which is a good way to assess students’ understanding of map skills?","q_ml":"ഭൂപട നൈപുണ്യങ്ങളെക്കുറിച്ചുള്ള കുട്ടികളുടെ ധാരണ വിലയിരുത്താൻ ഏറ്റവും നല്ല മാർഗം ഏതാണ്?","o":["No assessment","Memorization of locations","Objective test only","Practical map-based tasks"],"a":3,"e":"ഭൂപടത്തിൽ സ്ഥലങ്ങൾ കണ്ടെത്തുക, അടയാളപ്പെടുത്തുക, ചിഹ്നങ്ങൾ വ്യാഖ്യാനിക്കുക തുടങ്ങിയ പ്രായോഗിക പ്രവർത്തനങ്ങളിലൂടെ ഭൂപട നൈപുണ്യങ്ങൾ വിലയിരുത്താം."},{"q_en":"To teach consumer rights effectively, a teacher should:","q_ml":"ഉപഭോക്തൃ അവകാശങ്ങൾ ഫലപ്രദമായി പഠിപ്പിക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Teach only theory","Focus on definitions","Use real-life examples and case studies","Avoid examples"],"a":2,"e":"ഉപഭോക്തൃ തർക്കങ്ങൾ, തെറ്റായ പരസ്യങ്ങൾ, ഗുണനിലവാരമില്ലാത്ത ഉൽപ്പന്നങ്ങൾ തുടങ്ങിയ യഥാർഥ ഉദാഹരണങ്ങൾ ഉപയോഗിക്കുന്നത് ഉപഭോക്തൃ അവകാശങ്ങൾ മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"Which is a suitable activity for teaching natural resources?","q_ml":"പ്രകൃതിവിഭവങ്ങൾ പഠിപ്പിക്കുന്നതിനുള്ള അനുയോജ്യമായ പ്രവർത്തനം ഏതാണ്?","o":["Memorizing names","Skipping topic","Field visit to resource site","Reading textbook"],"a":2,"e":"പ്രകൃതിവിഭവങ്ങൾ ലഭിക്കുന്ന സ്ഥലങ്ങൾ സന്ദർശിക്കുന്നത് അവയുടെ ഉപയോഗം, പ്രാധാന്യം, സംരക്ഷണത്തിന്റെ ആവശ്യകത എന്നിവ നേരിട്ട് മനസ്സിലാക്കാൻ സഹായിക്കുന്നു."},{"q_en":"How can a teacher make Social Science inclusive for students with learning disabilities?","q_ml":"പഠനവൈകല്യമുള്ള കുട്ടികൾക്ക് സാമൂഹ്യശാസ്ത്ര പഠനം ഉൾക്കൊള്ളുന്നതും ഫലപ്രദവുമാക്കാൻ അധ്യാപകൻ എന്തുചെയ്യണം?","o":["Exclude from class","Reduce expectations","Differentiate instruction and use multisensory materials","Use one teaching method"],"a":2,"e":""}];

const KEYS = ['A', 'B', 'C', 'D'];
let ans = new Array(Q.length).fill(-1);
let done = new Array(Q.length).fill(false);

let globalTimeLeft = 3600; // 60 minutes for 50 questions 
let globalTmr = null;

function startGlobalTimer(){
  if(globalTmr) return; 
  updTimerDisplay();
  globalTmr = setInterval(() => {
    globalTimeLeft--;
    updTimerDisplay();
    if(globalTimeLeft <= 0){
      clearInterval(globalTmr);
      globalTmr = null;
      showResults();
    }
  }, 1000);
}

function updTimerDisplay(){
  const el = document.getElementById('tmr');
  if(!el) return;
  const mins = Math.floor(globalTimeLeft / 60);
  const secs = globalTimeLeft % 60;
  el.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  if(globalTimeLeft <= 120){
    el.className = 'timer-txt red';
  } else {
    el.className = 'timer-txt';
  }
}

function renderAllQuestions(){
  let html = `
  <div class="top-bar">
    <div class="header-profile">
      <div class="header-text-block">
        <span class="quiz-title">K-TET SOCIAL SCIENCE CATEGORY III – SET 3</span>
        <span class="quiz-subtitle">Questions 71–150 | English & Malayalam</span>
        <div style="margin-top: 2px;"><a href="https://guruplusblog.blogspot.com/" target="_blank" style="color: #93C5FD; font-size: 11px; font-weight: 600; text-decoration: none; word-break: break-all;">https://guruplusblog.blogspot.com/</a></div>
      </div>
      <div class="header-actions">
        <a href="https://wa.me/919539846888" target="_blank" class="whatsapp-btn">
          WhatsApp
        </a>
        <img src="myphoto.jpeg" alt="Profile" class="profile-pic" onerror="this.style.display='none'">
      </div>
    </div>
    <div class="top-row" style="margin-top: 10px;">
      <div class="timer-pill">
        <span class="timer-label" style="margin-right:4px;">Time Left:</span>
        <span class="timer-txt" id="tmr">40:00</span>
      </div>
      <span class="q-badge">Total: ${Q.length}</span>
    </div>
  </div>`;

  Q.forEach((q, qIdx) => {
    const isD = done[qIdx];
    const ua = ans[qIdx];

    let optsHtml = q.o.map((o, oIdx) => {
      let cls = 'opt';
      if (isD) {
        if (oIdx === q.a) cls += ' correct-ans';
        else if (oIdx === ua) cls += ' wrong-ans';
        else cls += ' neutral-locked';
      } else {
        cls += ' unanswered';
      }
      return `<div class="${cls}" onclick="pick(${qIdx}, ${oIdx})"><span class="opt-key ${KEYS[oIdx]}">${KEYS[oIdx]}</span><span class="opt-txt">${o}</span></div>`;
    }).join('');

    let expHtml = '';
    if (isD) {
      const ok = ua === q.a;
      expHtml = `<div class="exp-box ${ok ? 'correct' : 'wrong'}"><div class="exp-label">${ok ? '✓ Correct!' : '✗ Incorrect'}</div>${q.e}</div>`;
    }

    html += `
    <div class="q-container" id="q-box-${qIdx}">
      <div class="q-num">Question ${qIdx + 1}</div>
      <div class="q-text-en">${q.q_en.replace(/\n/g, '<br>')}</div>
      <div class="q-text-ml">${q.q_ml}</div>
      <div class="opts">${optsHtml}</div>
      ${expHtml}
    </div>`;
  });

  html += `
  <div class="action-container">
    <button class="btn-submit-all" onclick="showResults()">Submit Test</button>
  </div>`;

  document.getElementById('app').innerHTML = html;
  updTimerDisplay();
}

function pick(qIdx, oIdx){
  if(done[qIdx]) return;
  ans[qIdx] = oIdx;
  done[qIdx] = true;

  const q = Q[qIdx];
  const ua = ans[qIdx];
  const ok = ua === q.a;

  if (ok) {
    playCorrectSound();
  }

  const qBox = document.getElementById(`q-box-${qIdx}`);
  if(qBox) {
    let optsHtml = q.o.map((o, idx) => {
      let cls = 'opt';
      if (idx === q.a) cls += ' correct-ans';
      else if (idx === ua) cls += ' wrong-ans';
      else cls += ' neutral-locked';
      return `<div class="${cls}" onclick="pick(${qIdx}, ${idx})"><span class="opt-key ${KEYS[idx]}">${KEYS[idx]}</span><span class="opt-txt">${o}</span></div>`;
    }).join('');

    let expHtml = `<div class="exp-box ${ok ? 'correct' : 'wrong'}"><div class="exp-label">${ok ? '✓ Correct!' : '✗ Incorrect'}</div>${q.e}</div>`;

    qBox.innerHTML = `
      <div class="q-num">Question ${qIdx + 1}</div>
      <div class="q-text-en">${q.q_en.replace(/\n/g, '<br>')}</div>
      <div class="q-text-ml">${q.q_ml}</div>
      <div class="opts">${optsHtml}</div>
      ${expHtml}
    `;
  }
}

function showResults(){
  if(globalTmr) {
    clearInterval(globalTmr);
    globalTmr = null;
  }
  let c=0, w=0, s=0;
  ans.forEach((a, i) => { if(a === -1) s++; else if(a === Q[i].a) c++; else w++; });
  const pct = Math.round((c / Q.length) * 100);
  const grade = pct >= 80 ? 'Excellent!' : pct >= 60 ? 'Good effort!' : pct >= 40 ? 'Keep practising' : 'Keep going!';

  let rev = Q.map((q, i) => {
    const ua = ans[i], isC = ua === q.a, isS = ua === -1;
    const rc = isS ? 'rs' : isC ? 'rc' : 'rw';
    const bl = isS ? 'Skipped' : isC ? 'Correct' : 'Wrong';
    return `<div class="r-card ${rc}">
      <div class="r-head"><span class="r-badge ${rc}">${bl}</span><span class="r-head"> Q${i+1}</span></div>
      <div class="r-qtxt-en">${q.q_en.replace(/\n/g, '<br>')}</div>
      <div class="q-text-ml">${q.q_ml}</div>
      ${!isS && !isC ? `<div class="r-ans wrong">Your answer: ${KEYS[ua]}. ${q.o[ua]}</div>` : ''}
      <div class="r-ans correct">Correct: ${KEYS[q.a]}. ${q.o[q.a]}</div>
      <div class="r-exp">${q.e}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="result-top">
    <div class="score-ring"><span class="score-big">${c}</span><span class="score-sub">/ ${Q.length}</span></div>
    <div class="result-label">${grade}</div>
    <div class="result-sub">${pct}% · ${c} correct out of ${Q.length}</div>
  </div>
  <div class="stats-grid">
    <div class="stat-c green"><div class="stat-n">${c}</div><div class="stat-l">Correct</div></div>
    <div class="stat-c red"><div class="stat-n">${w}</div><div class="stat-l">Wrong</div></div>
    <div class="stat-c gray"><div class="stat-n">${s}</div><div class="stat-l">Skipped</div></div>
  </div>
  <div class="review-title">Full review</div>
  ${rev}
  <button class="restart-btn" onclick="restartQuiz()">Restart quiz</button>`;
  window.scrollTo(0,0);
}

function restartQuiz(){
  ans = new Array(Q.length).fill(-1);
  done = new Array(Q.length).fill(false);
  globalTimeLeft = 2400;
  startGlobalTimer();
  renderAllQuestions();
  window.scrollTo(0,0);
}

startGlobalTimer();
renderAllQuestions();
</script>

</body>
</html>
